name: Django CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sakinafinance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev libmagic1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create Log Directory
      run: mkdir -p logs

    - name: Run Django Checks
      env:
        DEBUG: "True"
        DJANGO_SECRET_KEY: "django-insecure-ci-cd-test-key"
        DATABASE_URL: "postgres://postgres:postgres@localhost:5432/sakinafinance"
        REDIS_URL: "redis://localhost:6379/0"
      run: |
        python manage.py check

    - name: Run Tests
      env:
        DEBUG: "True"
        DJANGO_SECRET_KEY: "django-insecure-ci-cd-test-key"
        DATABASE_URL: "postgres://postgres:postgres@localhost:5432/sakinafinance"
        REDIS_URL: "redis://localhost:6379/0"
      run: |
        python manage.py test
